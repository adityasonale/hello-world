apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-k8s

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-k8s

  template:
    metadata:
      labels:
        app: hello-k8s

    spec:
      containers:
        - name: hello-world
          image: hello-world:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000